# Performance snippet for homecareinterior.co.id (nginx 1.18)
#
# 1. Put the gzip block in /etc/nginx/conf.d/gzip.conf (http context), or inside http { }.
# 2. Put the location blocks inside the existing `server { }` for the site,
#    ABOVE the `location / { ... }` / php block.
# 3. sudo nginx -t && sudo systemctl reload nginx

# ---- http context ----
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/javascript application/javascript application/json
    application/xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

# ---- server context ----
# Static assets that ship with the app: long-lived cache (filenames are versioned via ?v= or build hashes)
location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# Uploaded media (storage/<id>/<file>): cache 30 days, not immutable because files can be replaced
location ~* \.(?:jpe?g|png|webp|avif|gif)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
    try_files $uri =404;
}
